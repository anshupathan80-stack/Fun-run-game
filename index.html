<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,width=device-width,minimal-ui">
    <title>Fun Race 3D</title>
    <style>
        /* Body aur html se saari extra jagah khatam */
        html, body {
            background: #000;
            margin: 0 !important;
            padding: 0 !important;
            height: 100% !important;
            width: 100% !important;
            overflow: hidden;
        }

        /* Container ko poori screen par faila diya */
        #gameContainer {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0; /* Isse niche ki patti khatam ho jayegi */
            right: 0;
            display: flex;
            flex-direction: column;
        }

        /* Iframe ko full space lene ke liye force kiya */
        #game-iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Purane ad blocks ko puri tarah remove kiya */
        .verticalAd, .horizontalAd, #div-gpt-ad-banner-bottom {
            display: none !important;
            height: 0 !important;
            margin: 0 !important;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <iframe id="game-iframe" src="" webkit-playsinline="true" scrolling="no" frameborder="0" allow="autoplay"></iframe>
    </div>

    <script>
    (function(){
        const packageId = "fun-race-3d";
        let affiliateId = "A1000-10";
        const iframe = document.querySelector("#game-iframe");
        
        if (affiliateId == "A1000-10") {
            affiliateId += (Math.random() >= 0.5) ? "A" : "B";
        }
        
        if(iframe) {
            iframe.setAttribute("src", 'https://play.famobi.com/' + packageId + "/" + affiliateId);
        }
    })();
    </script>

</body>
</html>
